<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" style="background:#0d1117;font-family:monospace">
  <title>NexGen CAV Multi-Agent System Design</title>
  <desc>System architecture showing 8 CAV agents with MAPPO communication, MADDPG centralized critic, and AlphaSim physics layer</desc>

  <!-- Background panels -->
  <rect x="10" y="10" width="880" height="600" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Title -->
  <text x="450" y="42" fill="#e6edf3" font-size="15" font-weight="bold" text-anchor="middle">NexGen CAV Multi-Agent System Architecture</text>
  <text x="450" y="60" fill="#8b949e" font-size="10" text-anchor="middle">CSC 59866-E | Alhassana Diallo &amp; Marcley Colin</text>

  <!-- AlphaSim Layer -->
  <rect x="30" y="530" width="840" height="62" rx="8" fill="#1a1f2e" stroke="#3d5a80" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="450" y="552" fill="#7ea8d4" font-size="11" font-weight="bold" text-anchor="middle">AlphaSim / Alpamayo Physics Layer  (Marc)</text>
  <text x="450" y="568" fill="#8b949e" font-size="9.5" text-anchor="middle">Real V2V channel simulation · DSRC propagation · Sensor noise · Scene rendering</text>
  <text x="450" y="582" fill="#3d5a80" font-size="9" text-anchor="middle">nvidia/PhysicalAI-Autonomous-Vehicles-NuRec  ·  GPU required</text>

  <!-- MADDPG Centralized Critic -->
  <rect x="30" y="78" width="840" height="52" rx="8" fill="#1f1a2e" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="450" y="99" fill="#c39bd3" font-size="11" font-weight="bold" text-anchor="middle">MADDPG — Centralized Critic  (Training Only)</text>
  <text x="450" y="115" fill="#8b949e" font-size="9.5" text-anchor="middle">Input: all 8 agents obs + one-hot actions  Q(s1..s8, a1..a8)  ·  Replay buffer  ·  Soft target updates (tau=0.01)</text>

  <!-- Critic arrows -->
  <line x1="200" y1="130" x2="148" y2="205" stroke="#9b59b6" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="700" y1="130" x2="752" y2="205" stroke="#9b59b6" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <text x="70" y="175" fill="#9b59b6" font-size="8.5" opacity="0.8">gradient</text>
  <text x="780" y="175" fill="#9b59b6" font-size="8.5" opacity="0.8">gradient</text>

  <!-- Ring edges -->
  <line x1="450" y1="195" x2="577" y2="222" stroke="#3498db" stroke-width="1.5" opacity="0.7"/>
  <line x1="577" y1="222" x2="630" y2="340" stroke="#3498db" stroke-width="1.5" opacity="0.7"/>
  <line x1="630" y1="340" x2="577" y2="458" stroke="#3498db" stroke-width="1.5" opacity="0.7"/>
  <line x1="577" y1="458" x2="450" y2="490" stroke="#3498db" stroke-width="1.5" opacity="0.7"/>
  <line x1="450" y1="490" x2="323" y2="458" stroke="#3498db" stroke-width="1.5" opacity="0.7"/>
  <line x1="323" y1="458" x2="270" y2="340" stroke="#3498db" stroke-width="1.5" opacity="0.7"/>
  <line x1="270" y1="340" x2="323" y2="222" stroke="#3498db" stroke-width="1.5" opacity="0.7"/>
  <line x1="323" y1="222" x2="450" y2="195" stroke="#3498db" stroke-width="1.5" opacity="0.7"/>

  <!-- Chord edges -->
  <line x1="450" y1="195" x2="450" y2="490" stroke="#3498db" stroke-width="1" stroke-dasharray="5,3" opacity="0.45"/>
  <line x1="577" y1="222" x2="323" y2="458" stroke="#3498db" stroke-width="1" stroke-dasharray="5,3" opacity="0.45"/>
  <line x1="630" y1="340" x2="270" y2="340" stroke="#3498db" stroke-width="1" stroke-dasharray="5,3" opacity="0.45"/>
  <line x1="577" y1="458" x2="323" y2="222" stroke="#3498db" stroke-width="1" stroke-dasharray="5,3" opacity="0.45"/>

  <!-- MAPPO message arrows -->
  <defs>
    <marker id="arrowTeal" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#1abc9c" opacity="0.85"/>
    </marker>
  </defs>
  <path d="M 450 189 Q 520 160 571 218" stroke="#1abc9c" stroke-width="1.8" fill="none" opacity="0.75" marker-end="url(#arrowTeal)"/>
  <path d="M 571 228 Q 530 160 456 191" stroke="#1abc9c" stroke-width="1.8" fill="none" opacity="0.75" marker-end="url(#arrowTeal)"/>
  <path d="M 624 340 Q 660 270 581 228" stroke="#1abc9c" stroke-width="1.8" fill="none" opacity="0.75" marker-end="url(#arrowTeal)"/>
  <path d="M 270 340 Q 240 270 319 224" stroke="#1abc9c" stroke-width="1.8" fill="none" opacity="0.75" marker-end="url(#arrowTeal)"/>

  <!-- CAV nodes -->
  <circle cx="450" cy="207" r="28" fill="#161b22" stroke="#2ecc71" stroke-width="2"/>
  <text x="450" y="203" fill="#2ecc71" font-size="9" font-weight="bold" text-anchor="middle">CAV 0</text>
  <text x="450" y="215" fill="#8b949e" font-size="7.5" text-anchor="middle">actor p0</text>

  <circle cx="577" cy="234" r="28" fill="#161b22" stroke="#2ecc71" stroke-width="2"/>
  <text x="577" y="230" fill="#2ecc71" font-size="9" font-weight="bold" text-anchor="middle">CAV 1</text>
  <text x="577" y="242" fill="#8b949e" font-size="7.5" text-anchor="middle">actor p1</text>

  <circle cx="618" cy="340" r="28" fill="#161b22" stroke="#2ecc71" stroke-width="2"/>
  <text x="618" y="336" fill="#2ecc71" font-size="9" font-weight="bold" text-anchor="middle">CAV 2</text>
  <text x="618" y="348" fill="#8b949e" font-size="7.5" text-anchor="middle">actor p2</text>

  <circle cx="577" cy="446" r="28" fill="#161b22" stroke="#2ecc71" stroke-width="2"/>
  <text x="577" y="442" fill="#2ecc71" font-size="9" font-weight="bold" text-anchor="middle">CAV 3</text>
  <text x="577" y="454" fill="#8b949e" font-size="7.5" text-anchor="middle">actor p3</text>

  <circle cx="450" cy="478" r="28" fill="#161b22" stroke="#2ecc71" stroke-width="2"/>
  <text x="450" y="474" fill="#2ecc71" font-size="9" font-weight="bold" text-anchor="middle">CAV 4</text>
  <text x="450" y="486" fill="#8b949e" font-size="7.5" text-anchor="middle">actor p4</text>

  <circle cx="323" cy="446" r="28" fill="#161b22" stroke="#2ecc71" stroke-width="2"/>
  <text x="323" y="442" fill="#2ecc71" font-size="9" font-weight="bold" text-anchor="middle">CAV 5</text>
  <text x="323" y="454" fill="#8b949e" font-size="7.5" text-anchor="middle">actor p5</text>

  <circle cx="282" cy="340" r="28" fill="#161b22" stroke="#2ecc71" stroke-width="2"/>
  <text x="282" y="336" fill="#2ecc71" font-size="9" font-weight="bold" text-anchor="middle">CAV 6</text>
  <text x="282" y="348" fill="#8b949e" font-size="7.5" text-anchor="middle">actor p6</text>

  <circle cx="323" cy="234" r="28" fill="#161b22" stroke="#2ecc71" stroke-width="2"/>
  <text x="323" y="230" fill="#2ecc71" font-size="9" font-weight="bold" text-anchor="middle">CAV 7</text>
  <text x="323" y="242" fill="#8b949e" font-size="7.5" text-anchor="middle">actor p7</text>

  <!-- Env box -->
  <rect x="385" y="318" width="130" height="44" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="450" y="335" fill="#8b949e" font-size="8.5" text-anchor="middle">V2V Network Env</text>
  <text x="450" y="347" fill="#586069" font-size="7.5" text-anchor="middle">queues · loss · packets</text>
  <text x="450" y="358" fill="#586069" font-size="7.5" text-anchor="middle">PDR · LVR · Throughput</text>

  <!-- AlphaSim upward arrows -->
  <line x1="200" y1="530" x2="282" y2="370" stroke="#3d5a80" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="700" y1="530" x2="618" y2="370" stroke="#3d5a80" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Legend -->
  <rect x="660" y="240" width="210" height="165" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="765" y="257" fill="#e6edf3" font-size="9.5" font-weight="bold" text-anchor="middle">Legend</text>
  <line x1="672" y1="270" x2="700" y2="270" stroke="#3498db" stroke-width="2"/>
  <text x="707" y="273" fill="#8b949e" font-size="8.5">Ring edge (V2V link)</text>
  <line x1="672" y1="288" x2="700" y2="288" stroke="#3498db" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="707" y="291" fill="#8b949e" font-size="8.5">Chord edge</text>
  <line x1="672" y1="306" x2="696" y2="306" stroke="#1abc9c" stroke-width="2"/>
  <polygon points="694,302 700,306 694,310" fill="#1abc9c"/>
  <text x="707" y="309" fill="#8b949e" font-size="8.5">MAPPO msg vector</text>
  <line x1="672" y1="324" x2="700" y2="324" stroke="#9b59b6" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="707" y="327" fill="#8b949e" font-size="8.5">MADDPG gradient</text>
  <circle cx="683" cy="342" r="8" fill="#161b22" stroke="#2ecc71" stroke-width="2"/>
  <text x="707" y="345" fill="#8b949e" font-size="8.5">CAV agent (actor)</text>
  <rect x="672" y="356" width="16" height="10" rx="2" fill="#1a1f2e" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="707" y="364" fill="#8b949e" font-size="8.5">Centralized critic</text>
  <rect x="672" y="374" width="16" height="10" rx="2" fill="#1a1f2e" stroke="#3d5a80" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="707" y="382" fill="#8b949e" font-size="8.5">AlphaSim layer</text>

  <!-- CTDE box -->
  <rect x="30" y="240" width="200" height="130" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="130" y="258" fill="#e6edf3" font-size="9.5" font-weight="bold" text-anchor="middle">CTDE Paradigm</text>
  <text x="130" y="274" fill="#8b949e" font-size="8.5" text-anchor="middle">Centralized Training</text>
  <text x="130" y="286" fill="#8b949e" font-size="8.5" text-anchor="middle">Decentralized Execution</text>
  <line x1="50" y1="294" x2="210" y2="294" stroke="#30363d" stroke-width="0.8"/>
  <text x="130" y="308" fill="#586069" font-size="8" text-anchor="middle">Training: critic sees all obs</text>
  <text x="130" y="320" fill="#586069" font-size="8" text-anchor="middle">Execution: each CAV acts on</text>
  <text x="130" y="332" fill="#586069" font-size="8" text-anchor="middle">own obs + neighbor msgs</text>
  <line x1="50" y1="340" x2="210" y2="340" stroke="#30363d" stroke-width="0.8"/>
  <text x="130" y="353" fill="#1abc9c" font-size="8" text-anchor="middle">MAPPO msg dim: 8</text>
  <text x="130" y="365" fill="#9b59b6" font-size="8" text-anchor="middle">MADDPG critic in: 272-dim</text>
</svg>
