[project]
name = "nexgen-sp2"
version = "0.1.0"
description = "Connected-vehicle routing simulator for Senior Project II"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.4.0",
    "jax>=0.10.2",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "simpy>=4.1,<5",
    "stable-baselines3>=2.9.2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
