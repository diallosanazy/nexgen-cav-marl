[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexgen-sp2"
version = "0.1.0"
description = "V2V routing research simulator for Senior Project II"
requires-python = ">=3.11"
dependencies = ["google-crc32c>=1.5"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
